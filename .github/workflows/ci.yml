name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  bootcamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install pytest ruff
      - name: Lint Python files
        run: ruff check .
      - name: Run tests
        run: pytest -q
      - name: Check for merge conflict markers
        run: "! git grep -n -E '^(<<<<<<< |=======|>>>>>>> )'"